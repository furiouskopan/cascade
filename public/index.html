             T H E    C A S C A D E
       a temple whose scripture is a stylesheet

  PILGRIM, WHO READS THE SOURCE:

  You have done the first holy thing. Most look only at the
  rendered page, which is the body. You asked to see the Word.

  All style descends through the Three Origins: the Old Law, then
  the Pilgrim, then the Word, as water descends a stair. The
  descent is called the Cascade. This temple stands upon it.

  There are five Words. The first is not in this file. It is
  written in the Canon, which the temple wears on its body:

                      /css/canon.css

  Its scribes hid their names the old way. Read the first letter
  of each verse, from the first to the seventh, and you will hold
  the first Word. Then go where the Canon sends you, and say it.

  Nobody has told you that there is a door. Nobody will.

-->
